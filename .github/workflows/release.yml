name: release

# Push a tag like v1.0.0 to build the installers and attach them to a draft
# GitHub release (published by hand once checked).
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only: current PyTorch has no Intel Mac builds.
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential rpm

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install frontend dependencies
        run: npm install

      # uv sets up the AI engine on first launch (see src-tauri/src/engine.rs).
      - name: fetch uv for bundling
        shell: bash
        run: scripts/fetch-uv.sh ${{ matrix.target }}

      - name: install patched linuxdeploy gtk hook (native Wayland fix)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p ~/.cache/tauri
          cp .github/appimage/linuxdeploy-plugin-gtk.sh ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RapidRetouch ${{ github.ref_name }}'
          releaseBody: 'See the README for install instructions. On first launch RapidRetouch downloads its AI engine (about 1–3 GB, once).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  # Copies of the main installers under names without a version number, so
  # https://github.com/crispin81/RapidRetouch/releases/latest/download/<name>
  # always serves the newest published release (the website links to these).
  stable-names:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: upload version-free copies
        run: |
          mkdir out && cd out
          gh release download "$TAG" -p '*_amd64.AppImage' -p '*_aarch64.dmg' -p '*_x64_en-US.msi' -p '*_x64-setup.exe'
          mv *_amd64.AppImage RapidRetouch_linux_x86_64.AppImage
          mv *_aarch64.dmg RapidRetouch_mac_apple_silicon.dmg
          mv *_x64_en-US.msi RapidRetouch_windows_x64.msi
          mv *_x64-setup.exe RapidRetouch_windows_x64_setup.exe
          gh release upload "$TAG" --clobber *
