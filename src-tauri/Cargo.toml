[package]
name = "rapidretouch"
version = "1.0.2"
description = "AI-assisted studio portrait retouching"
authors = ["Chris Cork"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "rapidretouch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
